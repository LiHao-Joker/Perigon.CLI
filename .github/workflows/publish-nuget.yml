name: Publish Perigon.CLI to GitHub Packages

on:
  push:
    branches:
      - nuget
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify PowerShell Core
        shell: bash
        run: pwsh --version

      - name: Read package metadata and compute four-part version
        id: package
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $projectPath = 'src/Apps/CommandLine/CommandLine.csproj'
          $packageId = (Select-Xml -Path $projectPath -XPath '/Project//PackageId').Node.InnerText
          $projectVersion = (Select-Xml -Path $projectPath -XPath '/Project//Version').Node.InnerText

          if ([string]::IsNullOrWhiteSpace($packageId) -or [string]::IsNullOrWhiteSpace($projectVersion)) {
              throw "PackageId or Version is missing from $projectPath."
          }

          if ($projectVersion -notmatch '^(\d+)\.(\d+)\.(\d+)') {
              throw "Version '$projectVersion' does not start with three numeric segments."
          }

          $major = $Matches[1]
          $minor = $Matches[2]
          $patch = $Matches[3]
          $revision = [int]$env:RUN_NUMBER
          $version = "$major.$minor.$patch.$revision"

          # 把四段版本写回 csproj，确保后续 PublishToLocal.ps1 / dotnet pack 使用该版本。
          [xml]$projectXml = Get-Content -LiteralPath $projectPath
          $versionNode = $projectXml.SelectSingleNode('/Project//Version')
          if ($null -eq $versionNode) {
              throw "Version node was not found in $projectPath."
          }
          $versionNode.InnerText = $version
          $fullProjectPath = (Resolve-Path -LiteralPath $projectPath).Path
          $projectXml.Save($fullProjectPath)

          $packagePath = "artifacts/$packageId.$version.nupkg"
          "package_id=$packageId" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "package_path=$packagePath" >> $env:GITHUB_OUTPUT

      - name: Build and pack CLI with Studio
        shell: pwsh
        run: |
          & './scripts/PublishToLocal.ps1' -withStudio:$true
          if ($LASTEXITCODE -ne 0) {
              throw "PublishToLocal.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Validate package contents
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
        run: |
          $packagePath = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE_PATH
          if (-not (Test-Path -LiteralPath $packagePath)) {
              throw "Package was not created: $packagePath"
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
              $studioEntry = $archive.Entries | Where-Object { $_.FullName -match '(^|/)studio\.zip$' } | Select-Object -First 1
              if ($null -eq $studioEntry) {
                  throw 'The NuGet package does not contain studio.zip.'
              }

              $nuspecEntry = $archive.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
              if ($null -eq $nuspecEntry) {
                  throw 'The NuGet package does not contain a .nuspec file.'
              }

              $reader = [System.IO.StreamReader]::new($nuspecEntry.Open())
              try {
                  [xml]$nuspec = $reader.ReadToEnd()
              }
              finally {
                  $reader.Dispose()
              }

              if ([string]$nuspec.package.metadata.version -ne $env:PACKAGE_VERSION) {
                  throw "Package version does not match $env:PACKAGE_VERSION."
              }
          }
          finally {
              $archive.Dispose()
          }

          Write-Host "Validated package: $packagePath"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perigon.CLI-${{ steps.package.outputs.package_version }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error

      - name: Push package to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          $packagePath = Join-Path $env:GITHUB_WORKSPACE $env:PACKAGE_PATH
          $source = "https://nuget.pkg.github.com/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/index.json"
          dotnet nuget push $packagePath `
            --api-key $env:GITHUB_TOKEN `
            --source $source `
            --skip-duplicate

      - name: Install published CLI package
        shell: pwsh
        env:
          PACKAGE_ID: ${{ steps.package.outputs.package_id }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
          PACKAGE_DIR: ${{ github.workspace }}/artifacts
        run: |
          dotnet tool install --global $env:PACKAGE_ID `
            --version $env:PACKAGE_VERSION `
            --add-source $env:PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to install $env:PACKAGE_ID $env:PACKAGE_VERSION."
          }

          Write-Host "Installed global tools:"
          dotnet tool list --global